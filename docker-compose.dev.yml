services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports: ['5432:5432']
    volumes: [pgdata-dev:/var/lib/postgresql/data]
volumes:
  pgdata-dev: {}
